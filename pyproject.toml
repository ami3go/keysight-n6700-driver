[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "keysight-n6700-driver"
version = "0.6.0"
description = "Framework-independent Python driver for Keysight/Agilent N6700 modular power systems, with an optional Robot Framework adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandr Chasnyk" }]
keywords = ["scpi", "keysight", "agilent", "n6700", "power-supply", "smu", "test-automation", "lpds"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "scpi-driver-core @ git+https://github.com/ami3go/scpi-driver-core@ec19ab88906d8e6ac270b30d7615ce7e75dc6a08",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "typing_extensions>=4.8; python_version < '3.11'",
]

[project.optional-dependencies]
visa = ["scpi-driver-core[visa] @ git+https://github.com/ami3go/scpi-driver-core@ec19ab88906d8e6ac270b30d7615ce7e75dc6a08"]
robotframework = ["robotframework>=7.0,<9"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "ruff>=0.9",
  "mypy>=1.13",
  "types-jsonschema>=4.21",
  "types-PyYAML>=6.0",
  "build>=1.2",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]

[project.urls]
Homepage = "https://github.com/ami3go/keysight-n6700-driver"
Hub = "https://github.com/ami3go/Lab-equipment-pyDrivers"

[project.scripts]
n6700ctl = "keysight_n6700.cli:main"

[project.entry-points."lpds.drivers"]
"keysight.n6700" = "keysight_n6700.plugin:KeysightN6700Plugin"

[project.entry-points."lpds.adapters"]
"robotframework.keysight.n6700" = "keysight_n6700_robotframework_adapter.plugin:KeysightN6700RobotFrameworkAdapterPlugin"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/keysight_n6700",
  "adapters/robotframework/keysight_n6700_robotframework_adapter",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"adapters/robotframework" = ""

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests", "adapters/robotframework/tests"]
markers = [
  "hardware: tests that require real hardware (HIL, disabled by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "RET", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"adapters/robotframework/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
packages = ["keysight_n6700"]
warn_unused_configs = true
strict = true

[[tool.mypy.overrides]]
module = "keysight_n6700_robotframework_adapter.*"
warn_return_any = false
