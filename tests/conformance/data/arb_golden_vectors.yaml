- id: current-sequence
  family: sequence
  vendor: '[SOURce:]ARB:SEQuence:STEP:CURRent:*'
  call:
    method: configure_current_arb_sequence
    args:
    - 1
    - - sequence_step:
          waveform:
            shape: ArbStep
            args: [0.1, 0.2, 0.01]
            kwargs: {}
          kwargs: {}
      - sequence_step:
          waveform:
            shape: ArbSine
            args: [0.1, 0.3, 100.0]
            kwargs: {}
          kwargs: {}
    kwargs: {maximum_current_a: 1.0}
  simulator: {sequence_step_base: 0}
  writes: ['INIT:CONT:TRAN OFF,(@1)', 'ABOR:TRAN (@1)', 'VOLT:MODE FIX,(@1)', 'CURR:MODE FIX,(@1)', 'ARB:FUNC:TYPE
      CURR,(@1)', 'ARB:FUNC:SHAP SEQ,(@1)', 'ARB:SEQ:RES (@1)', 'ARB:SEQ:STEP:FUNC:SHAP STEP,0,(@1)',
    'ARB:SEQ:STEP:PAC DWEL,0,(@1)', 'ARB:SEQ:STEP:COUN 1,0,(@1)', 'ARB:SEQ:STEP:CURR:STEP:STAR 0.1,0,(@1)',
    'ARB:SEQ:STEP:CURR:STEP:END 0.2,0,(@1)', 'ARB:SEQ:STEP:CURR:STEP:STAR:TIM 0.01,0,(@1)', 'ARB:SEQ:STEP:FUNC:SHAP
      SIN,1,(@1)', 'ARB:SEQ:STEP:PAC DWEL,1,(@1)', 'ARB:SEQ:STEP:COUN 1,1,(@1)', 'ARB:SEQ:STEP:CURR:SIN:AMPL
      0.1,1,(@1)', 'ARB:SEQ:STEP:CURR:SIN:OFFS 0.3,1,(@1)', 'ARB:SEQ:STEP:CURR:SIN:FREQ 100,1,(@1)', 'ARB:SEQ:COUN
      1,(@1)', 'ARB:SEQ:TERM:LAST OFF,(@1)', 'CURR:MODE ARB,(@1)']
- id: current-step-mode
  family: step
  vendor: '[SOURce:]CURRent:TRIGgered; CURRent:MODE STEP'
  call:
    method: configure_current_step
    args: [1, 0.2]
    kwargs: {maximum_current_a: 1.0}
  writes: ['INIT:CONT:TRAN OFF,(@1)', 'ABOR:TRAN (@1)', 'VOLT:MODE FIX,(@1)', 'CURR:MODE FIX,(@1)', 'CURR:TRIG
      0.2,(@1)', 'STEP:TOUT OFF,(@1)', 'CURR:MODE STEP,(@1)']
