# ARB-R05 golden SCPI vectors for the source ARB/LIST families.
#
# Each vector replays one driver call on the simulator and pins the exact
# ordered list of mutating SCPI commands (queries are not listed).  The text
# was reviewed against the N6705 Programmer's Reference command tree in
# Keysight_documents/N6775A.pdf.md; tests/conformance/test_arb_golden_vectors.py
# also checks every header against that tree independently of the driver.
#
# Regenerate after an intentional protocol change, then review the diff line by
# line against the vendor text before committing.  Never regenerate to make a
# failing test pass.
vectors:
- id: voltage-arb-step
  family: arb-shape
  vendor: '[SOURce:]ARB:VOLTage:STEP:{STARt,END,STARt:TIMe}'
  call:
    method: configure_voltage_arb_waveform
    args: [1]
    kwargs:
      waveform:
        shape: ArbStep
        args: [1.0, 5.0, 0.002]
        kwargs: {}
      maximum_voltage_v: 10.0
  writes: ['INIT:CONT:TRAN OFF,(@1)', 'ABOR:TRAN (@1)', 'VOLT:MODE FIX,(@1)', 'CURR:MODE FIX,(@1)', 'ARB:FUNC:TYPE
      VOLT,(@1)', 'ARB:FUNC:SHAP STEP,(@1)', 'ARB:VOLT:STEP:STAR 1,(@1)', 'ARB:VOLT:STEP:END 5,(@1)',
    'ARB:VOLT:STEP:STAR:TIM 0.002,(@1)', 'ARB:COUN 1,(@1)', 'ARB:TERM:LAST OFF,(@1)', 'VOLT:MODE ARB,(@1)']
- id: voltage-arb-ramp
