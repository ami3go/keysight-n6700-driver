    method: configure_voltage_arb_waveform
    args: [1]
    kwargs:
      waveform:
        shape: ArbRamp
        args: [1.0, 5.0, 0.01]
        kwargs: {start_time_s: 0.002, end_time_s: 0.003}
      maximum_voltage_v: 10.0
  writes: ['INIT:CONT:TRAN OFF,(@1)', 'ABOR:TRAN (@1)', 'VOLT:MODE FIX,(@1)', 'CURR:MODE FIX,(@1)', 'ARB:FUNC:TYPE
      VOLT,(@1)', 'ARB:FUNC:SHAP RAMP,(@1)', 'ARB:VOLT:RAMP:STAR 1,(@1)', 'ARB:VOLT:RAMP:END 5,(@1)',
    'ARB:VOLT:RAMP:STAR:TIM 0.002,(@1)', 'ARB:VOLT:RAMP:RTIM 0.01,(@1)', 'ARB:VOLT:RAMP:END:TIM 0.003,(@1)',
    'ARB:COUN 1,(@1)', 'ARB:TERM:LAST OFF,(@1)', 'VOLT:MODE ARB,(@1)']
