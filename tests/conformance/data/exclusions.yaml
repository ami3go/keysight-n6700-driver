# LPDS-009 §28.3 / LPDS-019 §15: every device-facing method without a
# realized protocol vector must be listed here with an honest reason,
# reviewed and approved by the maintainer, not silently dropped.
#
# This driver's status is "untested" (LPDS-001 §9): unit tests and the 25
# protocol vectors in protocol_vectors.yaml pass against the simulator;
# nothing here has been run against real hardware, and the exclusions below
# are v0.1.0 conformance-pass scope decisions, not permanent gaps. They are
# already covered by tests/unit at the Python-call level (see the file next
# to each reason); what is missing is specifically the transport-boundary
# outbound/inbound protocol vector.
