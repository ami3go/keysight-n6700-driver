contract_schema_version: '1.0'
identity:
  plugin_id: keysight.n6700
  driver_name: keysight_n6700
  distribution_name: keysight-n6700-driver
  distribution_version: 0.7.11
  driver_import_path: keysight_n6700.driver
  driver_class: keysight_n6700.driver.N6700
  supported_models:
  - N67xx series mainframe
  - N673x/N674x/N675x/N676x/N677x
  - N678xA SMU
  - N679xA Electronic Load Module
mental_model:
  summary: One N6700 mainframe session exposes up to four independently addressed module channels. Installed
    modules determine whether a channel acts as a power source, SMU, measurement source, or verified electronic
    load.
  session_model: One driver instance may hold several named sessions (aliases) at once; most methods accept
    an optional `alias` and default to the currently selected one.
  state_ownership: The driver tracks session and connection state; the instrument is the sole authority
    for channel configuration, output state, protection state, and measurements.
  safety_model: Typed configuration defaults outputs/load inputs off. disconnect()/disconnect_all() attempt
    a best-effort shutdown first unless set_auto_shutdown_on_disconnect(False) was called. Raw SCPI (write_scpi/query_scpi)
    bypasses typed safeguards.
state_machine:
  reference: keysight_n6700.base.SessionState (LPDS-003 canonical enum)
  public_projection: keysight_n6700.base.SUPPORT_STATE_PROJECTION
  states:
  - disconnected
  - connecting
  - connected
  - configured
  - busy
  - waiting
  - recovering
  - error
  - closing
resources:
  consumed:
  - id: visa_resource
    type: exclusive
    description: VISA resource string for USB/LAN/vendor transport.
  - id: tcp_socket
    type: exclusive
    description: Host and TCP port, normally 5025.
  - id: session_alias
    type: exclusive_within_driver
    description: Unique named session.
  - id: mainframe_channel
    type: exclusive_for_mutation
    description: Channel 1..4; coordinate concurrent test ownership.
  provided:
  - id: dc_source
    quantity:
    - voltage
    - current
    - power
    availability: module-dependent
  - id: voltage_transient_source
    quantity:
    - voltage_list
    - voltage_arb
    - voltage_arb_shapes
    - voltage_constant_dwell_arb
    - voltage_arb_sequence
    - voltage_step
    - voltage_slew
    availability: supported source-module dependent; physical timing qualification pending
  - id: current_transient_source
    quantity:
    - current_list
    - current_arb
    - current_arb_shapes
    - current_constant_dwell_arb
    - current_arb_sequence
    - current_step
    - current_slew
    availability: power-supply and SMU modules; current slew N678xA SMU only; SMU requires current priority;
      physical qualification pending
  - id: smu
    quantity:
    - source_voltage
    - source_current
    - measure_voltage
    - measure_current
    availability: SMU module-dependent
  - id: electronic_load
    quantity:
    - cc
    - cv
    - cr
    - cp
    availability: N679xA (N6791A/N6792A) verified against official Keysight documentation; other real
      load modules remain restricted unless explicitly supported
  - id: internal_measurement
    quantity:
    - voltage
    - current
    - power
    availability: module-dependent
dependencies:
  runtime:
  - Python >=3.10
  - scpi-driver-core
  optional:
  - pyvisa (via scpi-driver-core[visa]) for VISA/USB transports
  - robotframework >=7,<9 for the adapter
  external:
  - A VISA backend (vendor IO suite or pyvisa-py) for VISA/USB resources
  - Network reachability for raw Ethernet
  - Reviewed cabling, fixtures, DUT limits, and interlocks
