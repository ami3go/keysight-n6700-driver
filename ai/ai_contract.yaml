  description: Require a confirmation phrase before write_scpi()/query_scpi() will run.
  category: safety
  standard: true
  risk_level: low
  mutating: false
  may_energize_or_sink_power: false
  preconditions: []
  postconditions: []
  side_effects: []
  support:
    state: supported
    confidence: declared
  binding:
    python_method: set_raw_scpi_guard
    canonical_method: set_raw_scpi_guard
    aliases: []
- capability_id: connection.session.open
