- capability_id: safety.raw_scpi.guard
  display_name: Set Raw SCPI Guard
  description: Require a confirmation phrase before write_scpi()/query_scpi() will run.
  category: safety
  standard: true
  risk_level: low
  mutating: false
  may_energize_or_sink_power: false
  preconditions: []
  postconditions: []
  side_effects: []
  support:
    state: supported
    confidence: declared
  binding:
